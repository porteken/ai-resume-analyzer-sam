name: SAM Build and Deploy

on:
  pull_request:
  push:
    branches:
      - dev
      - prd
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: sam-deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup SAM CLI
        uses: aws-actions/setup-sam@v2
        with:
          use-installer: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate SAM template
        run: sam validate --template template.yaml

      - name: Build Lambda layer dependencies
        run: bash build_layer.sh

      - name: Build SAM application
        run: sam build --use-container --template template.yaml

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/prd'))
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup SAM CLI
        uses: aws-actions/setup-sam@v2
        with:
          use-installer: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: github-actions-sam-deploy

      - name: Build Lambda layer dependencies
        run: bash build_layer.sh

      - name: Resolve deployment target from branch
        run: |
          if [[ "${GITHUB_REF}" == "refs/heads/dev" ]]; then
            echo "SAM_STACK_NAME=${{ vars.SAM_STACK_NAME_DEV || 'ai-resume-analyzer-dev' }}" >> "$GITHUB_ENV"
            echo "API_STAGE_NAME=dev" >> "$GITHUB_ENV"
          elif [[ "${GITHUB_REF}" == "refs/heads/prd" ]]; then
            echo "SAM_STACK_NAME=${{ vars.SAM_STACK_NAME_PROD || 'ai-resume-analyzer-prod' }}" >> "$GITHUB_ENV"
            echo "API_STAGE_NAME=prod" >> "$GITHUB_ENV"
          else
            echo "Unsupported branch for deployment: ${GITHUB_REF}"
            exit 1
          fi

      - name: Recover broken stack state (dev only)
        run: |
          set +e
          STACK_STATUS=$(aws cloudformation describe-stacks \
            --stack-name "$SAM_STACK_NAME" \
            --region "$AWS_REGION" \
            --query 'Stacks[0].StackStatus' \
            --output text 2>&1)
          DESCRIBE_RC=$?
          set -e

          if [[ $DESCRIBE_RC -ne 0 ]]; then
            if [[ "$STACK_STATUS" == *"does not exist"* ]]; then
              echo "Stack $SAM_STACK_NAME does not exist yet. Proceeding with create."
              exit 0
            fi
            echo "Could not read stack status:"
            echo "$STACK_STATUS"
            exit 1
          fi

          echo "Current stack status: $STACK_STATUS"

          if [[ "$STACK_STATUS" == "ROLLBACK_FAILED" ]]; then
            if [[ "$API_STAGE_NAME" != "dev" ]]; then
              echo "Stack is in ROLLBACK_FAILED for non-dev stage. Manual recovery required."
              exit 1
            fi

            echo "Deleting broken dev stack $SAM_STACK_NAME..."
            aws cloudformation delete-stack --stack-name "$SAM_STACK_NAME" --region "$AWS_REGION"
            aws cloudformation wait stack-delete-complete --stack-name "$SAM_STACK_NAME" --region "$AWS_REGION"
            echo "Deleted broken stack. Deploy step will recreate it."
          fi

      - name: Build and deploy
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          sam build --use-container --template template.yaml
          PARAM_OVERRIDES=("ApiStageName=$API_STAGE_NAME")
          if [[ -n "${GOOGLE_API_KEY:-}" ]]; then
            PARAM_OVERRIDES+=("GoogleApiKey=$GOOGLE_API_KEY")
          fi
          sam deploy \
            --stack-name "$SAM_STACK_NAME" \
            --region "$AWS_REGION" \
            --capabilities CAPABILITY_IAM \
            --resolve-s3 \
            --s3-prefix "$SAM_STACK_NAME" \
            --parameter-overrides "${PARAM_OVERRIDES[@]}" \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset
