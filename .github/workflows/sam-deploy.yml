name: SAM Build and Deploy

on:
  pull_request:            
    branches: ['dev', 'prd']
  push:                    
    branches: ['dev', 'prd']
  workflow_dispatch:       

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  SHARED_REST_API_ID: ${{ vars.SHARED_REST_API_ID || 'tbitqsc1li' }}
  ALLOWED_ORIGINS: ${{ vars.ALLOWED_ORIGINS || 'https://ai-resume-analyzer-app-lake.vercel.app,https://ai-resume-analyzer-app-git-dev-portekens-projects.vercel.app' }}
  ENABLE_S3_ACCESS_LOGGING: ${{ vars.ENABLE_S3_ACCESS_LOGGING || 'false' }}
  PYTHON_VERSION: '3.13'
  UV_PYTHON: '3.13'

jobs:
  
  
  build:
    name: Build SAM Application
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true

      - name: Install Python
        run: uv python install "$PYTHON_VERSION"

      - name: Setup SAM CLI
        uses: aws-actions/setup-sam@89ddb14d60e682855e3fea4be85b3c56485de310 # v3
        with:
          use-installer: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate SAM Template
        run: sam validate --template template.yaml

      - name: Build Lambda Layer Dependencies
        run: bash build_layer.sh

      - name: Build SAM Application
        run: sam build --use-container --template template.yaml

      - name: Fix Permissions for SAM Build Output
        run: sudo chown -R "$USER:$USER" .aws-sam/

      - name: Upload SAM Build Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sam-build-artifact
          path: .aws-sam/
          retention-days: 1
          if-no-files-found: error
          include-hidden-files: true

      - name: Upload Dependencies Layer Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sam-layer-artifact
          path: layers/dependencies/
          retention-days: 1
          if-no-files-found: error

  
  
  
  test-and-scan:
    name: Pytest & SonarQube Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Setup uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true

      - name: Install Python
        run: uv python install "$PYTHON_VERSION"

      - name: Install dependencies
        run: uv sync --locked --all-extras --dev --no-build

      - name: Run Pytest with Coverage
        run: uv run --locked --no-sync --no-build pytest

      - name: Run Ruff
        run: uv run --locked --no-sync --no-build ruff check .

      - name: Run Pyrefly
        run: uv run --locked --no-sync --no-build pyrefly check

      - name: Lint SAM Template
        run: sam validate --lint --template template.yaml

      - name: SonarQube Scan
        if: github.ref == 'refs/heads/dev'
        uses: SonarSource/sonarqube-scan-action@713881670b6b3676cda39549040e2d88c70d582e # v8.2.0
        with:
          args: -Dsonar.python.coverage.reportPaths=coverage.xml
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  
  
  
  deploy:
    name: Deploy to AWS
    needs: [build, test-and-scan] 
    runs-on: ubuntu-latest
    if: github.event_name == 'push'   
    permissions:
      contents: read
      id-token: write          
    concurrency:
      group: sam-deploy-${{ github.ref }}
      cancel-in-progress: false

    steps:
      - name: Checkout Repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Download SAM Build Artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sam-build-artifact
          path: .aws-sam/

      - name: Download Dependencies Layer Artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sam-layer-artifact
          path: layers/dependencies/

      - name: Verify Deploy Assets
        run: |
          set -euo pipefail

          if [[ ! -f .aws-sam/build/template.yaml ]]; then
            echo "::error::.aws-sam/build/template.yaml is missing after artifact download."
            exit 1
          fi

          if [[ ! -d layers/dependencies/python ]]; then
            echo "::error::layers/dependencies/python is missing after artifact download."
            exit 1
          fi

      - name: Setup SAM CLI
        uses: aws-actions/setup-sam@89ddb14d60e682855e3fea4be85b3c56485de310 # v3
        with:
          use-installer: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6.2.2
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: github-actions-sam-deploy

      - name: Resolve Deployment Target
        run: |
          set -euo pipefail
          BRANCH_NAME="${GITHUB_REF##*/}"

          case "$BRANCH_NAME" in
            prd)
              echo "DEPLOY_BRANCH=prd" >> "$GITHUB_ENV"
              echo "SAM_STACK_NAME=${{ vars.SAM_STACK_NAME_PROD || 'ai-resume-analyzer-prod' }}" >> "$GITHUB_ENV"
              echo "API_STAGE_NAME=prod" >> "$GITHUB_ENV"
              ;;
            dev)
              echo "DEPLOY_BRANCH=dev" >> "$GITHUB_ENV"
              echo "SAM_STACK_NAME=${{ vars.SAM_STACK_NAME_DEV || 'ai-resume-analyzer-dev' }}" >> "$GITHUB_ENV"
              echo "API_STAGE_NAME=dev" >> "$GITHUB_ENV"
              ;;
            *)
              echo "Refusing deploy from unsupported branch: $BRANCH_NAME"
              exit 1
              ;;
          esac

      - name: Validate Deploy Role Permissions
        run: |
          set -euo pipefail

          ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
          CALLER_ARN="$(aws sts get-caller-identity --query Arn --output text)"
          ROLE_NAME="$(echo "$CALLER_ARN" | sed -n 's#.*:assumed-role/\([^/]*\)/.*#\1#p')"

          if [[ -z "$ROLE_NAME" ]]; then
            echo "Caller is not an assumed IAM role. Skipping IAM simulation preflight."
            exit 0
          fi

          ROLE_ARN="arn:aws:iam::${ACCOUNT_ID}:role/${ROLE_NAME}"

          set +e
          SIMULATION_OUTPUT="$(
            aws iam simulate-principal-policy \
              --policy-source-arn "$ROLE_ARN" \
              --action-names s3:GetBucketPolicy s3:PutBucketPolicy s3:DeleteBucketPolicy \
              --resource-arns arn:aws:s3:::ai-resume-analyzer* \
              --query "EvaluationResults[?EvalDecision!='allowed'].EvalActionName" \
              --output text 2>&1
          )"
          SIMULATION_STATUS=$?
          set -e

          if [[ $SIMULATION_STATUS -ne 0 ]]; then
            echo "::warning::Unable to simulate IAM permissions for role '$ROLE_NAME'. Continuing deploy. Details: $SIMULATION_OUTPUT"
            exit 0
          fi

          MISSING_ACTIONS="$SIMULATION_OUTPUT"
          if [[ -n "${MISSING_ACTIONS// }" && "$MISSING_ACTIONS" != "None" ]]; then
            echo "::error::Missing required S3 bucket-policy permissions for role '$ROLE_NAME': $MISSING_ACTIONS"
            echo "::error::Grant s3:GetBucketPolicy,s3:PutBucketPolicy,s3:DeleteBucketPolicy on arn:aws:s3:::ai-resume-analyzer*"
            exit 1
          fi

          echo "Deploy role preflight passed."

      - name: Recover Broken Stack State
        run: |
          set -euo pipefail

          get_stack_status() {
            aws cloudformation describe-stacks \
              --stack-name "$SAM_STACK_NAME" \
              --region "$AWS_REGION" \
              --query 'Stacks[0].StackStatus' \
              --output text 2>/dev/null || true
          }

          print_recent_events() {
            aws cloudformation describe-stack-events \
              --stack-name "$SAM_STACK_NAME" \
              --region "$AWS_REGION" \
              --max-items 20 \
              --query 'StackEvents[].{Time:Timestamp,Resource:LogicalResourceId,Status:ResourceStatus,Reason:ResourceStatusReason}' \
              --output table || true
          }

          STACK_STATUS="$(get_stack_status)"
          if [[ -z "$STACK_STATUS" ]]; then
            echo "Stack does not exist. No recovery needed."
            exit 0
          fi

          echo "Current stack status: $STACK_STATUS"

          case "$STACK_STATUS" in
            UPDATE_ROLLBACK_COMPLETE)
              echo "Stack rolled back to previous state. Safe to re-deploy."
              ;;
            ROLLBACK_FAILED|ROLLBACK_COMPLETE|UPDATE_ROLLBACK_FAILED|CREATE_FAILED|DELETE_FAILED)
              echo "Detected broken CF stack ($STACK_STATUS). Cleaning up..."

              if [[ "$STACK_STATUS" == "DELETE_FAILED" ]]; then
                
                FAILED_RESOURCES="$(
                  aws cloudformation describe-stack-events \
                    --stack-name "$SAM_STACK_NAME" \
                    --region "$AWS_REGION" \
                    --query "StackEvents[?ResourceStatus=='DELETE_FAILED'].LogicalResourceId" \
                    --output text 2>/dev/null || true
                )"

                if [[ -n "$FAILED_RESOURCES" ]]; then
                  echo "Retaining resources that failed to delete: $FAILED_RESOURCES"
                  
                  aws cloudformation delete-stack \
                    --stack-name "$SAM_STACK_NAME" \
                    --region "$AWS_REGION" \
                    --retain-resources "$FAILED_RESOURCES"
                elif ! aws cloudformation delete-stack \
                  --stack-name "$SAM_STACK_NAME" \
                  --region "$AWS_REGION" \
                  --deletion-mode FORCE_DELETE_STACK; then
                  echo "FORCE_DELETE_STACK failed or unsupported. Retrying standard delete."
                  aws cloudformation delete-stack \
                    --stack-name "$SAM_STACK_NAME" \
                    --region "$AWS_REGION"
                fi
              else
                aws cloudformation delete-stack \
                  --stack-name "$SAM_STACK_NAME" \
                  --region "$AWS_REGION"
              fi

              if ! aws cloudformation wait stack-delete-complete \
                --stack-name "$SAM_STACK_NAME" \
                --region "$AWS_REGION"; then
                echo "Stack deletion did not complete. Recent events:"
                print_recent_events
              fi

              REMAINING_STATUS="$(get_stack_status)"
              if [[ -n "$REMAINING_STATUS" ]]; then
                echo "Stack still exists with status: $REMAINING_STATUS"
                echo "Unable to continue deploy safely."
                print_recent_events
                exit 1
              fi

              echo "Stack cleanup completed."
              ;;
            *)
              echo "No stack recovery needed."
              ;;
          esac

      - name: Deploy SAM Application
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GOOGLE_API_KEY_SECRET_ARN: ${{ secrets.GOOGLE_API_KEY_SECRET_ARN }}
          SAM_CLI_TELEMETRY: "0"
        run: |
          set -euo pipefail

          if [[ -z "${GOOGLE_API_KEY_SECRET_ARN:-}" && -z "${GOOGLE_API_KEY:-}" ]]; then
            echo "::error::Set either GOOGLE_API_KEY_SECRET_ARN or GOOGLE_API_KEY in GitHub secrets."
            exit 1
          fi

          
          PARAM_OVERRIDES=(
            "ApiStageName=$API_STAGE_NAME"
            "ExistingApiId=$SHARED_REST_API_ID"
            "AllowedOrigins=$ALLOWED_ORIGINS"
            "EnableS3AccessLogging=$ENABLE_S3_ACCESS_LOGGING"
          )

          if [[ -n "${GOOGLE_API_KEY_SECRET_ARN:-}" ]]; then
            PARAM_OVERRIDES+=("GoogleApiKeySecretArn=$GOOGLE_API_KEY_SECRET_ARN")
          elif [[ -n "${GOOGLE_API_KEY:-}" ]]; then
            PARAM_OVERRIDES+=("GoogleApiKey=$GOOGLE_API_KEY")
          fi

          
          set +e
          DEPLOY_OUTPUT="$(
            sam deploy \
              --template-file .aws-sam/build/template.yaml \
              --stack-name "$SAM_STACK_NAME" \
              --region "$AWS_REGION" \
              --capabilities CAPABILITY_IAM \
              --resolve-s3 \
              --s3-prefix "$SAM_STACK_NAME" \
              --parameter-overrides "${PARAM_OVERRIDES[@]}" \
              --no-confirm-changeset \
              --no-fail-on-empty-changeset 2>&1
          )"
          DEPLOY_STATUS=$?
          set -e

          echo "$DEPLOY_OUTPUT"

          if [[ $DEPLOY_STATUS -ne 0 ]]; then
            if echo "$DEPLOY_OUTPUT" | grep -qE "s3:PutBucketPolicy|s3:DeleteBucketPolicy|s3:GetBucketPolicy"; then
              echo "::error::SAM deploy failed due to missing S3 bucket policy permissions in CI role."
              echo "::error::Add s3:GetBucketPolicy,s3:PutBucketPolicy,s3:DeleteBucketPolicy to the assumed deploy role policy."
            fi
            exit "$DEPLOY_STATUS"
          fi

      - name: Sync Shared API Routes and Deploy Stage
        run: |
          set -euo pipefail

          
          
          
          REST_API_ID="$SHARED_REST_API_ID"
          REGION="$AWS_REGION"
          ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"

          UPLOAD_FN="${SAM_STACK_NAME}-PresignedUploadFunction"
          ANALYZE_FN="${SAM_STACK_NAME}-AnalyzeFunction"
          STATUS_FN="${SAM_STACK_NAME}-StatusFunction"

          
          aws lambda get-function --function-name "$UPLOAD_FN" >/dev/null
          aws lambda get-function --function-name "$ANALYZE_FN" >/dev/null
          aws lambda get-function --function-name "$STATUS_FN" >/dev/null

          
          
          
          normalize_id() {
            local value="${1:-}"
            if [[ -z "$value" || "$value" == "None" || "$value" == "null" ]]; then echo ""; else echo "$value"; fi
          }

          get_root_resource_id() {
            aws apigateway get-resources \
              --rest-api-id "$REST_API_ID" \
              --query "items[?path=='/'].id | [0]" \
              --output text
          }

          get_child_resource_id() {
            local parent_id="$1"
            local path_part="$2"
            aws apigateway get-resources \
              --rest-api-id "$REST_API_ID" \
              --query "items[?parentId=='${parent_id}' && pathPart=='${path_part}'].id |[0]" \
              --output text
          }

          ensure_child_resource() {
            local parent_id="$1"
            local path_part="$2"
            local resource_id
            
            resource_id="$(normalize_id "$(get_child_resource_id "$parent_id" "$path_part")")"
            if [[ -n "$resource_id" ]]; then
              echo "$resource_id"
              return 0
            fi
            
            aws apigateway create-resource \
              --rest-api-id "$REST_API_ID" \
              --parent-id "$parent_id" \
              --path-part "$path_part" \
              --query 'id' \
              --output text
          }

          ensure_method_exists() {
            local resource_id="$1"
            local http_method="$2"
            local req_params="${3:-}"
            local api_key_required="${4:-true}"


            if aws apigateway get-method \
              --rest-api-id "$REST_API_ID" \
              --resource-id "$resource_id" \
              --http-method "$http_method" >/dev/null 2>&1; then
                return 0
            fi

            local put_method_args=(
              --rest-api-id "$REST_API_ID"
              --resource-id "$resource_id"
              --http-method "$http_method"
              --authorization-type NONE
            )
            if [[ "$api_key_required" == "true" ]]; then
              put_method_args+=(--api-key-required)
            else
              put_method_args+=(--no-api-key-required)
            fi
            if [[ -n "$req_params" ]]; then
              put_method_args+=(--request-parameters "$req_params")
            fi

            aws apigateway put-method "${put_method_args[@]}" >/dev/null
          }


          set_api_key_required() {
            local resource_id="$1"
            local http_method="$2"
            aws apigateway update-method \
              --rest-api-id "$REST_API_ID" \
              --resource-id "$resource_id" \
              --http-method "$http_method" \
              --patch-operations op=replace,path=/apiKeyRequired,value=true >/dev/null
          }

          upsert_lambda_proxy_integration() {
            local resource_id="$1"
            local http_method="$2"
            local function_name="$3"
            
            local lambda_arn="arn:aws:lambda:${REGION}:${ACCOUNT_ID}:function:${function_name}"
            local integration_uri="arn:aws:apigateway:${REGION}:lambda:path/2015-03-31/functions/${lambda_arn}/invocations"

            ensure_method_exists "$resource_id" "$http_method"

            aws apigateway put-integration \
              --rest-api-id "$REST_API_ID" \
              --resource-id "$resource_id" \
              --http-method "$http_method" \
              --type AWS_PROXY \
              --integration-http-method POST \
              --uri "$integration_uri" >/dev/null
          }

          ensure_cors_method_response() {
            local resource_id="$1"
            local response_parameters
            response_parameters='{"method.response.header.Access-Control-Allow-Headers":true,"method.response.header.Access-Control-Allow-Methods":true,"method.response.header.Access-Control-Allow-Origin":true}'

            if aws apigateway get-method-response \
              --rest-api-id "$REST_API_ID" \
              --resource-id "$resource_id" \
              --http-method OPTIONS \
              --status-code 200 >/dev/null 2>&1; then
                return 0
            fi

            aws apigateway put-method-response \
              --rest-api-id "$REST_API_ID" \
              --resource-id "$resource_id" \
              --http-method OPTIONS \
              --status-code 200 \
              --response-parameters "$response_parameters" >/dev/null
          }

          build_cors_origin_condition() {
            local condition=""
            local origin
            IFS=',' read -ra origins <<< "$ALLOWED_ORIGINS"
            for origin in "${origins[@]}"; do
              origin="$(echo "$origin" | xargs)"
              origin="${origin%/}"
              [[ -z "$origin" ]] && continue
              if [[ -n "$condition" ]]; then
                condition+=" || "
              fi
              condition+='$origin == "'"$origin"'"'
            done
            echo "$condition"
          }

          upsert_cors_integration_response() {
            local resource_id="$1"
            local response_parameters
            response_parameters='{"method.response.header.Access-Control-Allow-Headers":"'"'"'Content-Type,Authorization,X-Amz-Date,X-Amz-Security-Token,X-Api-Key'"'"'","method.response.header.Access-Control-Allow-Methods":"'"'"'OPTIONS,GET,POST'"'"'"}'

            local origin_condition
            origin_condition="$(build_cors_origin_condition)"



            local vtl_template
            vtl_template='#set($origin = $input.params("Origin"))
            #if($origin == "")#set($origin = $input.params("origin"))#end
            #if('"$origin_condition"')
            #set($context.responseOverride.header.Access-Control-Allow-Origin = $origin)
            #end'

            local response_templates
            response_templates="$(jq -n --arg t "$vtl_template" '{"application/json": $t}')"

            aws apigateway put-integration-response \
              --rest-api-id "$REST_API_ID" \
              --resource-id "$resource_id" \
              --http-method OPTIONS \
              --status-code 200 \
              --response-parameters "$response_parameters" \
              --response-templates "$response_templates" >/dev/null
          }

          ensure_cors_options() {
            local resource_id="$1"
            ensure_method_exists "$resource_id" OPTIONS "" "false"

            aws apigateway put-integration \
              --rest-api-id "$REST_API_ID" \
              --resource-id "$resource_id" \
              --http-method OPTIONS \
              --type MOCK \
              --request-templates '{"application/json":"{\"statusCode\":200}"}' >/dev/null

            ensure_cors_method_response "$resource_id"
            upsert_cors_integration_response "$resource_id"
          }

          
          
          
          ROOT_RESOURCE_ID="$(normalize_id "$(get_root_resource_id)")"
          if [[ -z "$ROOT_RESOURCE_ID" ]]; then
            echo "Unable to resolve root resource ID for shared API: $REST_API_ID"
            exit 1
          fi

          
          UPLOAD_RESOURCE_ID="$(ensure_child_resource "$ROOT_RESOURCE_ID" upload)"
          ANALYZE_RESOURCE_ID="$(ensure_child_resource "$ROOT_RESOURCE_ID" analyze)"
          STATUS_PARENT_RESOURCE_ID="$(ensure_child_resource "$ROOT_RESOURCE_ID" status)"
          STATUS_RESOURCE_ID="$(ensure_child_resource "$STATUS_PARENT_RESOURCE_ID" '{job_id}')"


          upsert_lambda_proxy_integration "$UPLOAD_RESOURCE_ID" POST "$UPLOAD_FN"
          upsert_lambda_proxy_integration "$ANALYZE_RESOURCE_ID" POST "$ANALYZE_FN"

          ensure_method_exists "$STATUS_RESOURCE_ID" GET "method.request.path.job_id=true"
          upsert_lambda_proxy_integration "$STATUS_RESOURCE_ID" GET "$STATUS_FN"




          set_api_key_required "$UPLOAD_RESOURCE_ID" POST
          set_api_key_required "$ANALYZE_RESOURCE_ID" POST
          set_api_key_required "$STATUS_RESOURCE_ID" GET


          ensure_cors_options "$UPLOAD_RESOURCE_ID"
          ensure_cors_options "$ANALYZE_RESOURCE_ID"
          ensure_cors_options "$STATUS_RESOURCE_ID"




          USAGE_PLAN_NAME="ResumeAnalyzerUsagePlan"
          # Per-stage API keys for dev/prod split (key hygiene).
          # MANUAL ROTATION CHECKLIST (do NOT auto-rotate in CI - no creds in test):
          # 1. Purge api_info.txt from history: `bfg --delete-files api_info.txt`, then
          #    `git reflog expire --expire=now --all && git gc --prune=now --aggressive`, force-push (coordinate team).
          # 2. AWS console: API Gateway > API Keys > create/rotate ResumeAnalyzerApiKey-dev and ResumeAnalyzerApiKey-prod, copy values.
          # 3. Cloudflare Pages: set secret API_KEY per env (production=prod key, preview/dev=dev key), redeploy frontend.
          # 4. Delete legacy shared ResumeAnalyzerApiKey once frontends migrated.
          API_KEY_NAME="ResumeAnalyzerApiKey-${API_STAGE_NAME}"
          LEGACY_API_KEY_NAME="ResumeAnalyzerApiKey"

          USAGE_PLAN_ID="$(normalize_id "$(
            aws apigateway get-usage-plans \
              --query "items[?name=='${USAGE_PLAN_NAME}'].id | [0]" \
              --output text
          )")"

          if [[ -z "$USAGE_PLAN_ID" ]]; then
            USAGE_PLAN_ID="$(aws apigateway create-usage-plan \
              --name "$USAGE_PLAN_NAME" \
              --query 'id' --output text)"
          fi

          STAGE_ATTACHED_COUNT="$(aws apigateway get-usage-plan \
            --usage-plan-id "$USAGE_PLAN_ID" \
            --query "length(apiStages[?apiId=='${REST_API_ID}' && stage=='${API_STAGE_NAME}'])" \
            --output text)"

          if [[ "$STAGE_ATTACHED_COUNT" == "0" ]]; then
            aws apigateway update-usage-plan \
              --usage-plan-id "$USAGE_PLAN_ID" \
              --patch-operations "op=add,path=/apiStages,value=${REST_API_ID}:${API_STAGE_NAME}" >/dev/null
          fi

          # Global throttle (20 rps, burst 10) + monthly quota (50000/MONTH), idempotent.
          aws apigateway update-usage-plan \
            --usage-plan-id "$USAGE_PLAN_ID" \
            --patch-operations \
              "op=replace,path=/throttle/rateLimit,value=20" \
              "op=replace,path=/throttle/burstLimit,value=10" \
              "op=replace,path=/quota/limit,value=50000" \
              "op=replace,path=/quota/period,value=MONTH" >/dev/null || true

          # Per-method throttles (idempotent): POST /upload 5, POST /analyze 5, GET /status/{job_id} 50.
          aws apigateway update-usage-plan \
            --usage-plan-id "$USAGE_PLAN_ID" \
            --patch-operations \
              "op=replace,path=/apiStages/${REST_API_ID}:${API_STAGE_NAME}/throttle/~1upload~1POST/rateLimit,value=5" \
              "op=replace,path=/apiStages/${REST_API_ID}:${API_STAGE_NAME}/throttle/~1upload~1POST/burstLimit,value=5" \
              "op=replace,path=/apiStages/${REST_API_ID}:${API_STAGE_NAME}/throttle/~1analyze~1POST/rateLimit,value=5" \
              "op=replace,path=/apiStages/${REST_API_ID}:${API_STAGE_NAME}/throttle/~1analyze~1POST/burstLimit,value=5" \
              "op=replace,path=/apiStages/${REST_API_ID}:${API_STAGE_NAME}/throttle/~1status~1{job_id}~1GET/rateLimit,value=50" \
              "op=replace,path=/apiStages/${REST_API_ID}:${API_STAGE_NAME}/throttle/~1status~1{job_id}~1GET/burstLimit,value=50" >/dev/null || true

          API_KEY_ID="$(normalize_id "$(
            aws apigateway get-api-keys \
              --name-query "$API_KEY_NAME" \
              --no-include-values \
              --query "items[?name=='${API_KEY_NAME}'].id | [0]" \
              --output text
          )")"

          # Backward compat: fall back to legacy shared key if stage-specific not found.
          if [[ -z "$API_KEY_ID" ]]; then
            echo "Stage-specific key '${API_KEY_NAME}' not found, trying legacy '${LEGACY_API_KEY_NAME}'."
            API_KEY_ID="$(normalize_id "$(
              aws apigateway get-api-keys \
                --name-query "$LEGACY_API_KEY_NAME" \
                --no-include-values \
                --query "items[?name=='${LEGACY_API_KEY_NAME}'].id | [0]" \
                --output text
            )")"
          fi

          # Idempotent create: if neither exists, create stage-specific key.
          if [[ -z "$API_KEY_ID" ]]; then
            echo "No existing key found, creating stage-specific key '${API_KEY_NAME}'."
            API_KEY_ID="$(aws apigateway create-api-key \
              --name "$API_KEY_NAME" \
              --enabled \
              --query 'id' --output text)"
          fi

          if [[ -z "$API_KEY_ID" ]]; then
            echo "::error::Unable to resolve or create API key '${API_KEY_NAME}' (fallback '${LEGACY_API_KEY_NAME}')."
            exit 1
          fi

          KEY_ATTACHED_COUNT="$(aws apigateway get-usage-plan-keys \
            --usage-plan-id "$USAGE_PLAN_ID" \
            --query "length(items[?id=='${API_KEY_ID}'])" \
            --output text)"

          if [[ "$KEY_ATTACHED_COUNT" == "0" ]]; then
            aws apigateway create-usage-plan-key \
              --usage-plan-id "$USAGE_PLAN_ID" \
              --key-id "$API_KEY_ID" \
              --key-type API_KEY >/dev/null || true
          fi

          # WAFv2 association only - AnalyzerWebACL is owned by CloudFormation (template.yaml).
          # Do NOT create via CLI (duplicate Name causes AlreadyExists CREATE_FAILED).
          # Lookup CFN physical ARN first, fallback to list-by-name.
          WAF_NAME="${SAM_STACK_NAME}-AnalyzerWebACL"
          WAF_RESOURCE_ARN="arn:aws:apigateway:${REGION}::/restapis/${REST_API_ID}/stages/${API_STAGE_NAME}"
          WAF_ACL_ARN="$(normalize_id "$(aws cloudformation describe-stack-resource --stack-name "$SAM_STACK_NAME" --logical-resource-id AnalyzerWebACL --region "$REGION" --query 'StackResourceDetail.PhysicalResourceId' --output text 2>/dev/null || true)")"
          if [[ -z "$WAF_ACL_ARN" ]]; then
            WAF_ACL_ARN="$(normalize_id "$(aws wafv2 list-web-acls --scope REGIONAL --region "$REGION" --query "WebACLs[?Name=='${WAF_NAME}'].ARN | [0]" --output text 2>/dev/null || true)")"
          fi
          if [[ -n "$WAF_ACL_ARN" ]]; then
            aws wafv2 associate-web-acl --web-acl-arn "$WAF_ACL_ARN" --resource-arn "$WAF_RESOURCE_ARN" --region "$REGION" >/dev/null || true
          else
            echo "::warning::WAF ACL ${WAF_NAME} not found; skipping associate (CFN owns creation)."
          fi

          aws apigateway create-deployment \
            --rest-api-id "$REST_API_ID" \
            --stage-name "$API_STAGE_NAME" \
            --description "branch=${DEPLOY_BRANCH} sha=${GITHUB_SHA}" >/dev/null

          echo "🚀 Successfully deployed shared API ${REST_API_ID} to stage '${API_STAGE_NAME}' from stack ${SAM_STACK_NAME}"
