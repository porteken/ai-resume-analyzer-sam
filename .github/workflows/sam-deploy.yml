name: SAM Build and Deploy

on:
  pull_request:            # build validation on PRs
    branches:
      - 'dev'
      - 'prd'
  push:                    # full workflow on push only for dev/prd
    branches:
      - 'dev'
      - 'prd'
  workflow_dispatch:       # manual trigger

permissions:
  contents: read
  id-token: write          # for OIDC

concurrency:
  group: sam-deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  ENABLE_BUCKET_LIFECYCLE: ${{ vars.ENABLE_BUCKET_LIFECYCLE || 'false' }}
  ENABLE_BUCKET_PUBLIC_ACCESS_BLOCK: ${{ vars.ENABLE_BUCKET_PUBLIC_ACCESS_BLOCK || 'false' }}
  ENABLE_BUCKET_ENCRYPTION: ${{ vars.ENABLE_BUCKET_ENCRYPTION || 'false' }}
  ENABLE_BUCKET_CORS: ${{ vars.ENABLE_BUCKET_CORS || 'false' }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache Python deps + build artifacts
        uses: actions/cache@v3
        with:
          path: |
            ~/.cache/pip
            .aws-sam/build
          key: ${{ runner.os }}-sam-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-sam-

      - name: Setup SAM CLI
        uses: aws-actions/setup-sam@v2
        with:
          use-installer: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate SAM template
        run: sam validate --template template.yaml

      - name: Build Lambda layer dependencies
        run: bash build_layer.sh

      - name: Build SAM application
        run: sam build --use-container --template template.yaml

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push'   # deploy only on push, not on PR

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup SAM CLI
        uses: aws-actions/setup-sam@v2
        with:
          use-installer: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: github-actions-sam-deploy

      - name: Resolve deployment target
        run: |
          if [[ "${GITHUB_REF##*/}" == "prd" ]]; then
            echo "SAM_STACK_NAME=${{ vars.SAM_STACK_NAME_PROD || 'ai-resume-analyzer-prod' }}" >> "$GITHUB_ENV"
            echo "API_STAGE_NAME=prod" >> "$GITHUB_ENV"
          else
            echo "SAM_STACK_NAME=${{ vars.SAM_STACK_NAME_DEV || 'ai-resume-analyzer-dev' }}" >> "$GITHUB_ENV"
            echo "API_STAGE_NAME=dev" >> "$GITHUB_ENV"
          fi

      - name: Recover broken stack state
        run: |
          set -euo pipefail
          STACK_STATUS=$(aws cloudformation describe-stacks \
            --stack-name "$SAM_STACK_NAME" \
            --region "$AWS_REGION" \
            --query 'Stacks[0].StackStatus' \
            --output text 2>&1) || STACK_STATUS=""
          echo "Current stack status: $STACK_STATUS"

          case "$STACK_STATUS" in
            ROLLBACK_FAILED|ROLLBACK_COMPLETE|UPDATE_ROLLBACK_FAILED|UPDATE_ROLLBACK_COMPLETE|CREATE_FAILED|DELETE_FAILED)
              echo "Detected broken CF stack ($STACK_STATUS). Cleaning up..."
              ;;
            *)
              echo "No stack recovery needed."
              exit 0
              ;;
          esac

          delete_and_wait() {
            aws cloudformation delete-stack \
              --stack-name "$SAM_STACK_NAME" \
              --region "$AWS_REGION"
            aws cloudformation wait stack-delete-complete \
              --stack-name "$SAM_STACK_NAME" \
              --region "$AWS_REGION"
          }

          delete_and_wait || true

      - name: Build and Deploy
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          PARAM_OVERRIDES=(
            "ApiStageName=$API_STAGE_NAME"
            "EnableBucketLifecycle=$ENABLE_BUCKET_LIFECYCLE"
            "EnableBucketPublicAccessBlock=$ENABLE_BUCKET_PUBLIC_ACCESS_BLOCK"
            "EnableBucketEncryption=$ENABLE_BUCKET_ENCRYPTION"
            "EnableBucketCors=$ENABLE_BUCKET_CORS"
          )
          if [[ -n "${GOOGLE_API_KEY:-}" ]]; then
            PARAM_OVERRIDES+=("GoogleApiKey=$GOOGLE_API_KEY")
          fi

          sam deploy \
            --stack-name "$SAM_STACK_NAME" \
            --region "$AWS_REGION" \
            --capabilities CAPABILITY_IAM \
            --resolve-s3 \
            --s3-prefix "$SAM_STACK_NAME" \
            --parameter-overrides "${PARAM_OVERRIDES[@]}" \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset