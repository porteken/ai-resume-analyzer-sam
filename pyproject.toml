[project]
name = "ai-resume-analyzer-sam"
version = "0.1.0"
description = "Serverless resume analysis backend using AWS Lambda, S3, DynamoDB, and Google Gemini"
readme = "README.md"
requires-python = "~=3.13.0"
dependencies = [
    "google-genai==2.14.0",
]

[dependency-groups]
dev = [
    "boto3>=1.28.0",
    "boto3-stubs>=1.43.34",
    "botocore>=1.43.34",
    "ipython>=8.0.0",
    "moto>=4.0.0",
    "mypy>=1.0.0",
    "pre-commit>=3.0.0",
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
    "pyrefly>=0.35.0",
    "python-dotenv>=1.0.0",
    "python-lambda-local>=0.1.0",
    "ruff>=0.1.0",
]

[tool.ruff]
exclude = [
    ".git",
    ".venv",
    "**/.venv",
    "venv",
    "**/venv",
    "__pycache__",
    "**/site-packages",
    ".aws-sam",
    "layers",
    "build",
    "dist",
]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D203",
    "D213",
    "COM812",
    "ISC001",
    "EM101",
    "EM102",
    "TRY003",
    "ANN401",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "PLR2004", "ANN001", "SLF001", "PLC0415", "D101", "D102", "D107"]

[tool.pyrefly]
project-includes = ["resume_analyzer", "tests"]
project-excludes = [
    "**/.[!/.]*",
    "**/__pycache__",
    "**/site-packages",
    ".aws-sam",
    "build",
    "dist",
    "layers",
    "node_modules",
    "venv",
]
python-platform = "linux"
python-version = "3.13"
