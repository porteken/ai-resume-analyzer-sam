[project]
name = "ai-resume-analyzer-sam"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = "~=3.12.0"
dependencies = [
    "boto3>=1.28.0",
    "boto3-stubs>=1.43.34",
    "botocore>=1.43.34",
    "google-genai==1.32.0",
]

[dependency-groups]
dev = [
    "ipython>=8.0.0",
    "moto>=4.0.0",
    "mypy>=1.0.0",
    "pre-commit>=3.0.0",
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
    "pyright>=1.1.0",
    "python-dotenv>=1.0.0",
    "python-lambda-local>=0.1.0",
    "ruff>=0.1.0",
]

[tool.ruff]
exclude = [
    ".git",
    ".venv",
    "**/.venv",
    "venv",
    "**/venv",
    "__pycache__",
    "**/site-packages",
    ".aws-sam",
    "layers",
    "build",
    "dist",
]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D203",
    "D213",
    "COM812",
    "ISC001",
    "EM101",
    "EM102",
    "TRY003",
    "ANN401",
]

[tool.ruff.lint.per-file-ignores]
"resume_analyzer/upload_handler.py" = ["C901", "PLR0911"]
"tests/*" = ["S101", "PLR2004", "FBT001", "ANN001", "SLF001", "PLC0415", "D101", "D102", "D107"]
