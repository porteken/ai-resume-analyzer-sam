repos:
-   repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.10
    hooks:
    - id: ruff
      args: [--fix]
    - id: ruff-format
-   repo: local
    hooks:
    - id: pytest
      name: Run Pytest
      entry: pytest --no-cov
      language: system
      pass_filenames: false
      always_run: true
