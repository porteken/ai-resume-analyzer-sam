repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.13
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: pyrefly-check
        name: Pyrefly (type checking)
        entry: uv run --locked --no-sync pyrefly check
        language: system
        pass_filenames: false
        always_run: true
      - id: pytest
        name: Run Pytest
        entry: uv run pytest --no-cov
        language: system
        pass_filenames: false
        always_run: true
