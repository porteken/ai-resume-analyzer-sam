repos:
-   repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.11
    hooks:
    - id: ruff
      args: [--fix]
-   repo: https://github.com/psf/black
    rev: 26.3.1
    hooks:
    - id: black
-   repo: https://github.com/RobertCraigie/pyright-python
    rev: v1.1.408
    hooks:
    - id: pyright
-   repo: local
    hooks:
    - id: pytest
      name: Run Pytest
      entry: pytest --no-cov
      language: system
      pass_filenames: false
      always_run: true
