AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Description: AI Resume Analyzer using S3 presigned uploads and Gemini 3 Flash Preview multimodal PDF analysis.

Parameters:
  GoogleApiKey:
    Type: String
    Default: ""
    NoEcho: true
    Description: Optional Google Gemini API key fallback when Secrets Manager is not used. Prefer GoogleApiKeySecretArn for production deployments.

  GoogleApiKeySecretArn:
    Type: String
    Default: ""
    Description: Secrets Manager secret ARN containing the Google Gemini API key.

  GeminiModelId:
    Type: String
    Default: gemini-3-flash-preview
    Description: Google Gemini model ID used for resume analysis.

  GeminiThinkingLevel:
    Type: String
    Default: ""
    AllowedValues:
      - ""
      - MINIMAL
      - LOW
      - MEDIUM
      - HIGH
    Description: Optional Gemini 3 thinking_level override. Left empty, the model uses its own default (HIGH); measure latency/quality before lowering it.

  ApiStageName:
    Type: String
    Default: prod
    AllowedValues:
      - dev
      - prod

  ExistingApiId:
    Type: String
    Default: ""
    Description: Existing shared API Gateway REST API ID (ai-resume-analyzer).

  AllowedOrigins:
    Type: String
    Default: "https://ai-resume-analyzer-app-lake.vercel.app,https://ai-resume-analyzer-app-git-dev-portekens-projects.vercel.app"
    Description: Comma-separated frontend origins allowed by API and S3 CORS.

  EnableS3AccessLogging:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: Enable S3 server access logging for the resume uploads bucket.

  AccessLogsAuditBucketName:
    Type: String
    Default: ""
    Description: Optional separate S3 bucket name to receive access logs for the access-logs bucket itself. Leave empty unless you have a dedicated central audit bucket, because the log destination bucket should not self-log.

Conditions:
  UseS3AccessLogging: !Equals [!Ref EnableS3AccessLogging, "true"]
  UseAccessLogsAuditBucket: !Not [!Equals [!Ref AccessLogsAuditBucketName, ""]]
  UseGoogleApiKeySecretArn: !Not [!Equals [!Ref GoogleApiKeySecretArn, ""]]
Globals:
  Function:
    Runtime: python3.14
    Timeout: 10
    MemorySize: 128
    Architectures:
      - x86_64
    Layers:
      - !Ref DependenciesLayer
    Environment:
      Variables:
        CORS_ALLOWED_ORIGINS: !Ref AllowedOrigins

Resources:
  DependenciesLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: !Sub '${AWS::StackName}-dependencies'
      ContentUri: layers/dependencies/
      CompatibleRuntimes:
        - python3.14
      CompatibleArchitectures:
        - x86_64

  ResumeS3AccessLogsBucket:
    Type: AWS::S3::Bucket
    Condition: UseS3AccessLogging
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LoggingConfiguration: !If
        - UseAccessLogsAuditBucket
        - DestinationBucketName: !Ref AccessLogsAuditBucketName
          LogFilePrefix: access-logs-bucket/
        - !Ref AWS::NoValue

  ResumeS3AccessLogsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Condition: UseS3AccessLogging
    Properties:
      Bucket: !Ref ResumeS3AccessLogsBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransportForAccessLogsBucket
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt ResumeS3AccessLogsBucket.Arn
              - !Sub '${ResumeS3AccessLogsBucket.Arn}/*'
            Condition:
              Bool:
                "aws:SecureTransport": false
          - Sid: DenyInsecureTransportForAccessLogsBucketAwsPrincipals
            Effect: Deny
            Principal:
              AWS: "*"
            Action: "*"
            Resource:
              - !GetAtt ResumeS3AccessLogsBucket.Arn
              - !Sub '${ResumeS3AccessLogsBucket.Arn}/*'
            Condition:
              Bool:
                "aws:SecureTransport": false
          - Sid: AllowServerAccessLogsDelivery
            Effect: Allow
            Principal:
              Service: logging.s3.amazonaws.com
            Action: s3:PutObject
            Resource: !Sub '${ResumeS3AccessLogsBucket.Arn}/access-logs/*'
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnLike:
                aws:SourceArn: !GetAtt ResumeS3Bucket.Arn

  ResumeS3Bucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LoggingConfiguration: !If
        - UseS3AccessLogging
        - DestinationBucketName: !Ref ResumeS3AccessLogsBucket
          LogFilePrefix: access-logs/
        - !Ref AWS::NoValue
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins: !Split [",", !Ref AllowedOrigins]
            AllowedMethods:
              - POST
              - GET
            AllowedHeaders:
              - Content-Type
              - x-amz-meta-job_id
              - x-amz-meta-filename
            ExposedHeaders:
              - ETag
            MaxAge: 300
      LifecycleConfiguration:
        Rules:
          - Id: ExpireUploads
            Status: Enabled
            Prefix: uploads/
            ExpirationInDays: 1
            NoncurrentVersionExpiration:
              NoncurrentDays: 1
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1

  ResumeS3BucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ResumeS3Bucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt ResumeS3Bucket.Arn
              - !Sub '${ResumeS3Bucket.Arn}/*'
            Condition:
              Bool:
                "aws:SecureTransport": false
          - Sid: DenyInsecureTransportAwsPrincipals
            Effect: Deny
            Principal:
              AWS: "*"
            Action: "*"
            Resource:
              - !GetAtt ResumeS3Bucket.Arn
              - !Sub '${ResumeS3Bucket.Arn}/*'
            Condition:
              Bool:
                "aws:SecureTransport": false

  ResultsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: job_id
          AttributeType: S
      KeySchema:
        - AttributeName: job_id
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  PresignedUploadFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-PresignedUploadFunction'
      CodeUri: resume_analyzer/
      Handler: upload_handler.lambda_handler
      MemorySize: 256

      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - s3:PutObject
              Resource: !Sub arn:aws:s3:::${ResumeS3Bucket}/*
            - Effect: Allow
              Action:
                - dynamodb:PutItem
              Resource: !GetAtt ResultsTable.Arn

      Environment:
        Variables:
          RESUME_BUCKET: !Ref ResumeS3Bucket
          RESULTS_TABLE: !Ref ResultsTable
          UPLOAD_EXPIRES_SECONDS: '900'

  AnalyzeFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-AnalyzeFunction'
      CodeUri: resume_analyzer/
      Handler: lambda_function.lambda_handler
      Timeout: 90
      MemorySize: 1024
      ReservedConcurrentExecutions: 10

      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - s3:GetObject
              Resource: !Sub arn:aws:s3:::${ResumeS3Bucket}/*
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:UpdateItem
              Resource: !GetAtt ResultsTable.Arn
            - Effect: Allow
              Action:
                - lambda:InvokeFunction
              Resource: !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${AWS::StackName}-AnalyzeFunction
        - !If
          - UseGoogleApiKeySecretArn
          - Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: !Ref GoogleApiKeySecretArn
          - !Ref AWS::NoValue

      Environment:
        Variables:
          GOOGLE_API_KEY: !If [UseGoogleApiKeySecretArn, "", !Ref GoogleApiKey]
          GOOGLE_API_KEY_SECRET_ARN: !Ref GoogleApiKeySecretArn
          GEMINI_MODEL_ID: !Ref GeminiModelId
          GEMINI_THINKING_LEVEL: !Ref GeminiThinkingLevel
          RESUME_BUCKET: !Ref ResumeS3Bucket
          RESULTS_TABLE: !Ref ResultsTable
          AWS_ACCOUNT_ID: !Ref AWS::AccountId
          ANALYZE_FUNCTION_NAME: !Sub '${AWS::StackName}-AnalyzeFunction'

  StatusFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-StatusFunction'
      CodeUri: resume_analyzer/
      Handler: status_handler.lambda_handler
      MemorySize: 512
      Environment:
        Variables:
          RESULTS_TABLE: !Ref ResultsTable

      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
              Resource: !GetAtt ResultsTable.Arn

  PresignedUploadInvokePermissionForApiGateway:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref PresignedUploadFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ExistingApiId}/${ApiStageName}/POST/upload

  AnalyzeInvokePermissionForApiGateway:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref AnalyzeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ExistingApiId}/${ApiStageName}/POST/analyze

  StatusInvokePermissionForApiGateway:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref StatusFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ExistingApiId}/${ApiStageName}/GET/status/*

  PresignedUploadFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub /aws/lambda/${PresignedUploadFunction}
      RetentionInDays: 5

  AnalyzeFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub /aws/lambda/${AnalyzeFunction}
      RetentionInDays: 5

  StatusFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub /aws/lambda/${StatusFunction}
      RetentionInDays: 5

  AnalyzeGeminiFailureMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref AnalyzeFunctionLogGroup
      FilterPattern: '"Analysis service is temporarily unavailable"'
      MetricTransformations:
        - MetricNamespace: !Sub '${AWS::StackName}/ResumeAnalyzer'
          MetricName: GeminiFailures
          MetricValue: '1'

  PresignedUploadErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Presigned upload Lambda is returning errors.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref PresignedUploadFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  AnalyzeErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Analyze Lambda is returning errors.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref AnalyzeFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  AnalyzeThrottlesAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Analyze Lambda is being throttled.
      Namespace: AWS/Lambda
      MetricName: Throttles
      Dimensions:
        - Name: FunctionName
          Value: !Ref AnalyzeFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  AnalyzeDurationAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Analyze Lambda duration is close to timeout.
      Namespace: AWS/Lambda
      MetricName: Duration
      Dimensions:
        - Name: FunctionName
          Value: !Ref AnalyzeFunction
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 80000
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  StatusErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Status Lambda is returning errors.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref StatusFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  GeminiFailuresAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Gemini analysis failures were detected in AnalyzeFunction logs.
      Namespace: !Sub '${AWS::StackName}/ResumeAnalyzer'
      MetricName: GeminiFailures
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

Outputs:
  ResumeBucketName:
    Description: S3 bucket for uploaded resumes
    Value: !Ref ResumeS3Bucket

  UploadEndpoint:
    Description: Endpoint to request a presigned upload POST
    Value: !Sub https://${ExistingApiId}.execute-api.${AWS::Region}.amazonaws.com/${ApiStageName}/upload

  AnalyzeEndpoint:
    Description: Endpoint to trigger analysis
    Value: !Sub https://${ExistingApiId}.execute-api.${AWS::Region}.amazonaws.com/${ApiStageName}/analyze

  StatusEndpoint:
    Description: Endpoint to fetch status
    Value: !Sub https://${ExistingApiId}.execute-api.${AWS::Region}.amazonaws.com/${ApiStageName}/status/{job_id}
