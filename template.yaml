AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Description: AI Resume Analyzer using S3 presigned uploads and Gemini 3 Flash multimodal PDF analysis.

Parameters:
  GoogleApiKey:
    Type: String
    NoEcho: true
    Description: Google Gemini API key (kept secret).

  ApiStageName:
    Type: String
    Default: prod
    AllowedValues:
      - dev
      - prod

  ExistingApiId:
    Type: String
    Default: tbitqsc1li
    Description: Existing shared API Gateway REST API ID (ai-resume-analyzer).

  AllowedOrigin:
    Type: String
    Default: "*"
    Description: Frontend origin allowed by API and S3 CORS.

Globals:
  Function:
    Runtime: python3.11
    Timeout: 10
    MemorySize: 128
    Environment:
      Variables:
        CORS_ALLOW_ORIGIN: !Ref AllowedOrigin

Resources:
  ResumeS3Bucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins:
              - !Ref AllowedOrigin
            AllowedMethods:
              - POST
              - GET
            AllowedHeaders:
              - "*"
            ExposedHeaders:
              - ETag
            MaxAge: 300

  ResultsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: job_id
          AttributeType: S
      KeySchema:
        - AttributeName: job_id
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  PresignedUploadFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-PresignedUploadFunction'
      CodeUri: resume_analyzer/
      Handler: upload_handler.lambda_handler

      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - s3:PutObject
                - s3:PutObjectAcl
              Resource: !Sub arn:aws:s3:::${ResumeS3Bucket}/*
            - Effect: Allow
              Action:
                - dynamodb:PutItem
                - dynamodb:UpdateItem
              Resource: !GetAtt ResultsTable.Arn

      Environment:
        Variables:
          RESUME_BUCKET: !Ref ResumeS3Bucket
          RESULTS_TABLE: !Ref ResultsTable
          UPLOAD_EXPIRES_SECONDS: '900'

  AnalyzeFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-AnalyzeFunction'
      CodeUri: resume_analyzer/
      Handler: lambda_function.lambda_handler
      Timeout: 30
      MemorySize: 384

      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - s3:GetObject
              Resource: !Sub arn:aws:s3:::${ResumeS3Bucket}/*
            - Effect: Allow
              Action:
                - dynamodb:PutItem
                - dynamodb:UpdateItem
              Resource: !GetAtt ResultsTable.Arn

      Environment:
        Variables:
          GOOGLE_API_KEY: !Ref GoogleApiKey
          GEMINI_MODEL_ID: gemini-3-flash-preview
          RESUME_BUCKET: !Ref ResumeS3Bucket
          RESULTS_TABLE: !Ref ResultsTable
          AWS_ACCOUNT_ID: !Ref AWS::AccountId

  StatusFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-StatusFunction'
      CodeUri: resume_analyzer/
      Handler: status_handler.lambda_handler

      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
              Resource: !GetAtt ResultsTable.Arn

  PresignedUploadInvokePermissionForApiGateway:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref PresignedUploadFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ExistingApiId}/*/*/*

  AnalyzeInvokePermissionForApiGateway:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref AnalyzeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ExistingApiId}/*/*/*

  StatusInvokePermissionForApiGateway:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref StatusFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ExistingApiId}/*/*/*

  PresignedUploadFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${PresignedUploadFunction}
      RetentionInDays: 5

  AnalyzeFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${AnalyzeFunction}
      RetentionInDays: 5

  StatusFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${StatusFunction}
      RetentionInDays: 5

Outputs:
  ResumeBucketName:
    Description: S3 bucket for uploaded resumes
    Value: !Ref ResumeS3Bucket

  UploadEndpoint:
    Description: Endpoint to request a presigned upload POST
    Value: !Sub https://${ExistingApiId}.execute-api.${AWS::Region}.amazonaws.com/${ApiStageName}/upload

  AnalyzeEndpoint:
    Description: Endpoint to trigger analysis
    Value: !Sub https://${ExistingApiId}.execute-api.${AWS::Region}.amazonaws.com/${ApiStageName}/analyze

  StatusEndpoint:
    Description: Endpoint to fetch status
    Value: !Sub https://${ExistingApiId}.execute-api.${AWS::Region}.amazonaws.com/${ApiStageName}/status/{job_id}
