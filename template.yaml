AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: AI Resume Analyzer using S3 presigned uploads and Gemini 3 Flash multimodal PDF analysis.

Parameters:
  GoogleApiKey:
    Type: String
    NoEcho: true
    Description: Google Gemini API key.
  ApiStageName:
    Type: String
    Default: prod
    AllowedValues:
      - dev
      - prod
  AllowedOrigin:
    Type: String
    Default: https://app.example.com
    Description: Frontend origin allowed by API and S3 CORS.

Resources:
  ResumeS3Bucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins:
              - !Ref AllowedOrigin
            AllowedMethods:
              - POST
              - GET
            AllowedHeaders:
              - "*"
            ExposedHeaders:
              - ETag
            MaxAge: 300

  ResultsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: job_id
          AttributeType: S
      KeySchema:
        - AttributeName: job_id
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  ResumeAnalyzerApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: !Ref ApiStageName
      OpenApiVersion: '3.0.1'
      Cors:
        AllowMethods: "'GET,POST,OPTIONS'"
        AllowHeaders: "'Content-Type,Authorization,X-Api-Key,X-Amz-Date,X-Amz-Security-Token'"
        AllowOrigin: !Sub "'${AllowedOrigin}'"
      GatewayResponses:
        DEFAULT_4XX:
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: !Sub "'${AllowedOrigin}'"
              Access-Control-Allow-Headers: "'Content-Type,Authorization,X-Api-Key,X-Amz-Date,X-Amz-Security-Token'"
              Access-Control-Allow-Methods: "'GET,POST,OPTIONS'"
        DEFAULT_5XX:
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: !Sub "'${AllowedOrigin}'"
              Access-Control-Allow-Headers: "'Content-Type,Authorization,X-Api-Key,X-Amz-Date,X-Amz-Security-Token'"
              Access-Control-Allow-Methods: "'GET,POST,OPTIONS'"

  PresignedUploadFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-PresignedUploadFunction'
      CodeUri: resume_analyzer/
      Handler: upload_handler.lambda_handler
      Runtime: python3.11
      Timeout: 10
      MemorySize: 128
      Policies:
        - S3WritePolicy:
            BucketName: !Ref ResumeS3Bucket
        - DynamoDBCrudPolicy:
            TableName: !Ref ResultsTable
      Environment:
        Variables:
          RESUME_BUCKET: !Ref ResumeS3Bucket
          RESULTS_TABLE: !Ref ResultsTable
          AWS_ACCOUNT_ID: !Ref AWS::AccountId
          CORS_ALLOW_ORIGIN: !Ref AllowedOrigin
          UPLOAD_EXPIRES_SECONDS: '900'
      Events:
        UploadApi:
          Type: Api
          Properties:
            RestApiId: !Ref ResumeAnalyzerApi
            Path: /upload
            Method: POST

  AnalyzeFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-AnalyzeFunction'
      CodeUri: resume_analyzer/
      Handler: lambda_function.lambda_handler
      Runtime: python3.11
      Timeout: 30
      MemorySize: 384
      Policies:
        - S3ReadPolicy:
            BucketName: !Ref ResumeS3Bucket
        - DynamoDBCrudPolicy:
            TableName: !Ref ResultsTable
      Environment:
        Variables:
          GOOGLE_API_KEY: !Ref GoogleApiKey
          GEMINI_MODEL_ID: gemini-3-flash-preview
          RESUME_BUCKET: !Ref ResumeS3Bucket
          RESULTS_TABLE: !Ref ResultsTable
          AWS_ACCOUNT_ID: !Ref AWS::AccountId
          CORS_ALLOW_ORIGIN: !Ref AllowedOrigin
      Events:
        AnalyzeApi:
          Type: Api
          Properties:
            RestApiId: !Ref ResumeAnalyzerApi
            Path: /analyze
            Method: POST

  StatusFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-StatusFunction'
      CodeUri: resume_analyzer/
      Handler: status_handler.lambda_handler
      Runtime: python3.11
      Timeout: 5
      MemorySize: 128
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref ResultsTable
      Environment:
        Variables:
          RESULTS_TABLE: !Ref ResultsTable
          CORS_ALLOW_ORIGIN: !Ref AllowedOrigin
      Events:
        StatusApi:
          Type: Api
          Properties:
            RestApiId: !Ref ResumeAnalyzerApi
            Path: /status/{job_id}
            Method: GET

Outputs:
  ResumeBucketName:
    Description: S3 bucket for uploaded resumes
    Value: !Ref ResumeS3Bucket
  UploadEndpoint:
    Description: Endpoint to request a presigned S3 upload POST
    Value: !Sub https://${ResumeAnalyzerApi}.execute-api.${AWS::Region}.amazonaws.com/${ApiStageName}/upload
  AnalyzeEndpoint:
    Description: Endpoint to trigger Gemini resume analysis
    Value: !Sub https://${ResumeAnalyzerApi}.execute-api.${AWS::Region}.amazonaws.com/${ApiStageName}/analyze
  StatusEndpoint:
    Description: Endpoint to fetch analysis status by job ID
    Value: !Sub https://${ResumeAnalyzerApi}.execute-api.${AWS::Region}.amazonaws.com/${ApiStageName}/status/{job_id}
