[pytest]

python_files = test_*.py
python_classes = Test*
python_functions = test_*

testpaths = tests

pythonpath = .

addopts =
    --verbose
    --strict-markers
    --cov=resume_analyzer
    --cov-report=term-missing
    --cov-report=html
    --cov-report=xml
    --cov-branch
    --tb=short


markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow running tests
    aws: Tests requiring AWS services


filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning


log_cli = false
log_cli_level = INFO
